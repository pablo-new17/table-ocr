<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f6feb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="表格 OCR">
  <title>表格 OCR</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>表格 OCR <small id="app-version" class="status"></small></h1>
    <p id="offline-status" class="status">檢查離線狀態中…</p>
    <p id="camera-status" class="status"></p>
  </header>

  <main>
    <section class="actions">
      <button id="camera-button" class="button primary" type="button" disabled>拍照</button>
      <input id="camera-input" type="file" accept="image/*" capture="environment" hidden>
      <label class="button">
        從相簿選擇
        <input id="file-input" type="file" accept="image/*" hidden>
      </label>
    </section>

    <!-- 網頁內的相機畫面 -->
    <div id="camera-view" class="camera-view" hidden>
      <video id="camera-video" autoplay playsinline muted></video>
      <div class="camera-actions">
        <button id="camera-cancel" class="button" type="button">取消</button>
        <button id="camera-shoot" class="button primary" type="button">拍下</button>
      </div>
    </div>

    <section>
      <p id="engine-status" class="status">載入辨識引擎中…</p>
      <p id="progress" class="status"></p>
    </section>

    <section id="preview-section" hidden>
      <h2>偵測結果</h2>
      <p class="hint">紅線是找到的表格框線，藍框是找到的文字。照片方向不對時，可以轉 90 度再辨識一次。</p>
      <div class="actions">
        <button id="rotate-left" class="button" type="button">向左轉 90° 再辨識</button>
        <button id="rotate-right" class="button" type="button">向右轉 90° 再辨識</button>
      </div>
      <canvas id="preview"></canvas>
    </section>

    <section id="review-section" hidden>
      <h2>可能辨識錯誤</h2>
      <p class="hint">下面是信心分數低於 0.8 的文字，左邊是照片原圖，點原圖會跳到表格裡那一格。每一項列出前 3 名候選文字與信心分數，按一下就換成那個文字；都不對的話，在「自己輸入」欄位打字，按「確定」。</p>
      <ul id="review-list" class="review-list"></ul>
    </section>

    <section id="result-section" hidden>
      <h2>辨識結果</h2>
      <p class="hint">點一下格子就能修改內容，改完再匯出。黃色底的格子是信心分數低於 0.8、可能辨識錯誤的格子。</p>
      <div class="table-wrap">
        <table id="result-table"></table>
      </div>
      <div class="actions">
        <button id="export-xlsx" class="button primary" type="button">匯出 .xlsx</button>
      </div>
    </section>
  </main>

  <script src="vendor/opencv.js" async></script>
  <script src="vendor/ort.wasm.min.js"></script>
  <script src="vendor/xlsx.full.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
